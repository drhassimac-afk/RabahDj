name: Build React Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: false  # منع مشاكل submodule

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'  # تسريع التثبيت

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Folder (Clean Build)
        run: |
          npx expo prebuild --platform android --clean
          echo "✅ Prebuild completed"

      - name: 🔑 Fix signing configuration
        run: |
          # إنشاء ملف التوقيع إذا لم يكن موجوداً
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: 🔑 Sign release build with debug key
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: 🚀 Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: RabahDj-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: 🚀 Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Pre-Release Build"
          draft: false
          prerelease: true  # تغيير إلى true
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # لا تفشل إذا فشل الـ release
