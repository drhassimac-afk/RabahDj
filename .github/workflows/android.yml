name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # زيادة الوقت إلى ساعة

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: false
        
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: android-actions/setup-android@v3
        
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      
    - name: Prebuild
      run: npx expo prebuild --platform android --clean
      
    - name: Fix timeout
      run: |
        echo "systemProp.gradle.internal.http.connectionTimeout=300000" >> android/gradle.properties
        echo "systemProp.gradle.internal.http.socketTimeout=300000" >> android/gradle.properties
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
