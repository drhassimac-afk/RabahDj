name: Build Debug APK (Dev with Metro)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Folder
        run: npx expo prebuild --platform android

      - name: 🛠️ Embed JS Bundle in Debug APK (Fallback)
        run: |
          cd android/app
          sed -i '/^react {/a\    debuggableVariants = []' build.gradle

      - name: 🚀 Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RabahDj-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
