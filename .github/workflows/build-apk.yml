name: Build React Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # صلاحية ضرورية لكي يتمكن الأكشن من إنشاء وتحديث الـ Release

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Folder
        run: npx expo prebuild --platform android

      - name: 🔑 Sign release build with debug key (for easy install/testing)
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: 🚀 Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: RabahDj-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🚀 Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest # اسم التاج الثابت للـ Release
          name: "Latest Pre-Release Build"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite: true # لإجبار غيت هاب على حذف النسخة القديمة واستبدالها بالجديدة فوراً
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
