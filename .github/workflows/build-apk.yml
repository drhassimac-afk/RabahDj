name: Build React Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Folder (Clean Build)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Sign release build with debug key
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: 🚀 Build Release APK
        env:
          # قلّلنا حد الذاكرة لـ Gradle (كان 4096م) وخصّصنا حد ذاكرة واضح لـ Node
          # المسؤول عن تجميع كود الجافاسكربت (Metro) — بدون هذا التوزيع، Gradle
          # ياخذ كل الذاكرة المتاحة على عامل GitHub Actions (~7 جيجا) ويترك Node
          # بدون ذاكرة كافية فينهار بصمت بلا أي رسالة خطأ (OOM) بالضبط بهذه الخطوة.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: RabahDj-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🚀 Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Pre-Release Build"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

